[project]
name = "nordic-signals"
version = "0.1.0"
description = "Data collectors for a Nordnet allocation advisor covering Norwegian and Swedish shares"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
nordic-signals = "nordic_signals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nordic_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
