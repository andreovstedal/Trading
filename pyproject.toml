[project]
name = "nordic-signals"
version = "0.1.0"
description = "Allocation advisor for Nordnet-tradable Norwegian and Swedish shares: collectors, model and web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
nordic-signals = "nordic_signals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nordic_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
